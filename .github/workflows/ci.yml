name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node-version }} / React ${{ matrix.react }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
        # The package declares react >=16.8 as an optional peer, so the hooks
        # are checked against both versions consumers actually run.
        react: ["18", "19"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: yarn

      - run: yarn install --frozen-lockfile

      - name: Install React 18
        if: matrix.react == '18'
        run: yarn add -D react@^18.3.1 react-dom@^18.3.1 @types/react@^18 @types/react-dom@^18

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build

  package:
    name: Publishable tarball
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      # dist/ is gitignored; this fails loudly if the tarball would ship
      # without the code rather than silently publishing an empty package.
      - name: Check tarball contents
        run: yarn check-pack
